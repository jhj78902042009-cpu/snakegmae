<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>네온 스네이크 게임</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pretendard:wght@400;600;700&display=swap');

    body {
      background-color: #0d1117;
      font-family: 'Pretendard', sans-serif;
      touch-action: manipulation;
    }

    .pixel-font {
      font-family: 'Press Start 2P', monospace;
    }

    .canvas-container {
      position: relative;
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.25), 0 0 50px rgba(147, 51, 234, 0.15);
    }

    canvas {
      background-color: #161b22;
      border: 2px solid #30363d;
      border-radius: 12px;
      display: block;
    }

    .game-btn {
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .game-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col items-center justify-center p-4 select-none">

  <div class="w-full max-w-lg flex flex-col items-center my-6">
    
    <!-- Title & Score Board -->
    <header class="w-full text-center mb-4">
      <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-500 mb-2">
        SNAKE GAME
      </h1>
      
      <div class="flex justify-between items-center bg-slate-800/80 backdrop-blur border border-slate-700 px-6 py-3 rounded-xl shadow-lg w-full">
        <div class="flex flex-col items-start">
          <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider">현재 점수</span>
          <span id="currentScore" class="pixel-font text-xl text-cyan-400">0</span>
        </div>
        <div class="h-8 w-[1px] bg-slate-700"></div>
        <div class="flex flex-col items-end">
          <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider">최고 점수</span>
          <span id="highScore" class="pixel-font text-xl text-yellow-400">0</span>
        </div>
      </div>
    </header>

    <!-- Canvas Area -->
    <div class="canvas-container rounded-xl overflow-hidden mb-4">
      <canvas id="gameCanvas" width="400" height="400" class="w-full h-auto max-w-[400px] aspect-square"></canvas>

      <!-- Game Overlay (Start / Game Over) -->
      <div id="gameOverlay" class="absolute inset-0 bg-slate-900/90 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center rounded-xl transition-opacity duration-300">
        <div id="overlayIcon" class="text-5xl text-cyan-400 mb-3 animate-bounce">
          <i class="fa-solid fa-gamepad"></i>
        </div>
        <h2 id="overlayTitle" class="text-2xl font-bold mb-2 text-white">뱀 게임 시작하기</h2>
        <p id="overlaySub" class="text-sm text-slate-400 mb-6">방향키나 아래 화살표 버튼으로 조정하세요.</p>
        
        <button id="startBtn" class="game-btn px-8 py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold rounded-xl text-lg flex items-center gap-2">
          <i class="fa-solid fa-play"></i> 게임 시작
        </button>
      </div>
    </div>

    <!-- Controls Info / Mobile D-Pad -->
    <div class="w-full flex flex-col items-center gap-3">
      <!-- On-screen directional buttons for Touch & Click -->
      <div class="grid grid-cols-3 gap-2 w-48 sm:w-56">
        <div></div>
        <button id="btnUp" class="game-btn bg-slate-800 hover:bg-slate-700 active:bg-cyan-600 border border-slate-700 p-3 rounded-lg text-lg text-slate-200">
          <i class="fa-solid fa-arrow-up"></i>
        </button>
        <div></div>
        <button id="btnLeft" class="game-btn bg-slate-800 hover:bg-slate-700 active:bg-cyan-600 border border-slate-700 p-3 rounded-lg text-lg text-slate-200">
          <i class="fa-solid fa-arrow-left"></i>
        </button>
        <button id="btnDown" class="game-btn bg-slate-800 hover:bg-slate-700 active:bg-cyan-600 border border-slate-700 p-3 rounded-lg text-lg text-slate-200">
          <i class="fa-solid fa-arrow-down"></i>
        </button>
        <button id="btnRight" class="game-btn bg-slate-800 hover:bg-slate-700 active:bg-cyan-600 border border-slate-700 p-3 rounded-lg text-lg text-slate-200">
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>

      <div class="text-xs text-slate-500 mt-1 flex items-center gap-2">
        <i class="fa-solid fa-keyboard"></i> 키보드 방향키 또는 WASD로 조작 가능
      </div>
    </div>

    <!-- Disqus Comment Section -->
    <div class="w-full mt-8 bg-slate-800/80 backdrop-blur border border-slate-700 p-5 rounded-xl shadow-lg">
      <h3 class="text-lg font-bold text-slate-200 mb-4 flex items-center gap-2 border-b border-slate-700 pb-3">
        <i class="fa-solid fa-comments text-cyan-400"></i> 댓글 & 방명록
      </h3>
      <div id="disqus_thread"></div>
      <script>
        (function() {
          var d = document, s = d.createElement('script');
          s.src = 'https://baku-3.disqus.com/embed.js';
          s.setAttribute('data-timestamp', +new Date());
          (d.head || d.body).appendChild(s);
        })();
      </script>
      <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
    </div>

  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI elements
    const currentScoreEl = document.getElementById('currentScore');
    const highScoreEl = document.getElementById('highScore');
    const overlay = document.getElementById('gameOverlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlaySub = document.getElementById('overlaySub');
    const overlayIcon = document.getElementById('overlayIcon');
    const startBtn = document.getElementById('startBtn');

    // Controls
    const btnUp = document.getElementById('btnUp');
    const btnDown = document.getElementById('btnDown');
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');

    // Game constants
    const GRID_SIZE = 20; // 20x20 grid
    const TILE_COUNT = canvas.width / GRID_SIZE; // 20 tiles
    const INITIAL_SPEED = 120; // ms per frame

    // Game State
    let snake = [];
    let food = { x: 0, y: 0 };
    let dx = GRID_SIZE;
    let dy = 0;
    let score = 0;
    let highScore = localStorage.getItem('snake_high_score') || 0;
    let gameInterval = null;
    let isRunning = false;
    let changedDirectionInFrame = false;

    highScoreEl.textContent = highScore;

    function initGame() {
      // Set initial snake (3 segments long)
      snake = [
        { x: 10 * GRID_SIZE, y: 10 * GRID_SIZE },
        { x: 9 * GRID_SIZE, y: 10 * GRID_SIZE },
        { x: 8 * GRID_SIZE, y: 10 * GRID_SIZE }
      ];
      dx = GRID_SIZE;
      dy = 0;
      score = 0;
      currentScoreEl.textContent = score;
      generateFood();
    }

    function generateFood() {
      let validPosition = false;
      while (!validPosition) {
        food.x = Math.floor(Math.random() * TILE_COUNT) * GRID_SIZE;
        food.y = Math.floor(Math.random() * TILE_COUNT) * GRID_SIZE;

        // Ensure food does not spawn on top of snake body
        validPosition = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
    }

    function startGame() {
      initGame();
      isRunning = true;
      overlay.classList.add('opacity-0', 'pointer-events-none');
      
      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(gameLoop, INITIAL_SPEED);
    }

    function gameOver() {
      isRunning = false;
      clearInterval(gameInterval);

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('snake_high_score', highScore);
        highScoreEl.textContent = highScore;
      }

      overlayTitle.textContent = "게임 오버!";
      overlaySub.textContent = `최종 점수: ${score}점`;
      overlayIcon.innerHTML = `<i class="fa-solid fa-skull-crossbones text-rose-500"></i>`;
      startBtn.innerHTML = `<i class="fa-solid fa-rotate-right"></i> 다시 하기`;
      
      overlay.classList.remove('opacity-0', 'pointer-events-none');
    }

    function gameLoop() {
      changedDirectionInFrame = false;
      
      // Calculate new head position
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall collision check
      if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
        gameOver();
        return;
      }

      // Self collision check
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        gameOver();
        return;
      }

      // Add new head
      snake.unshift(head);

      // Check food collision
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        currentScoreEl.textContent = score;
        generateFood();
      } else {
        // Remove tail if no food eaten
        snake.pop();
      }

      draw();
    }

    function draw() {
      // Clear canvas background
      ctx.fillStyle = '#161b22';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Grid subtle lines
      ctx.strokeStyle = '#21262d';
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += GRID_SIZE) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Draw Food (Glow effect)
      ctx.fillStyle = '#ef4444';
      ctx.shadowColor = '#ef4444';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(food.x + GRID_SIZE / 2, food.y + GRID_SIZE / 2, GRID_SIZE / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0; // Reset shadow

      // Draw Snake
      snake.forEach((segment, index) => {
        if (index === 0) {
          // Head
          ctx.fillStyle = '#22d3ee'; // Bright cyan
          ctx.shadowColor = '#22d3ee';
          ctx.shadowBlur = 8;
        } else {
          // Body gradient blend
          ctx.fillStyle = '#3b82f6';
          ctx.shadowBlur = 0;
        }

        ctx.beginPath();
        ctx.roundRect(segment.x + 1, segment.y + 1, GRID_SIZE - 2, GRID_SIZE - 2, 4);
        ctx.fill();
      });

      ctx.shadowBlur = 0; // Clear remaining glow
    }

    function changeDirection(newDx, newDy) {
      if (changedDirectionInFrame) return;

      // Prevent 180-degree reverse turns
      if (newDx === -dx && newDx !== 0) return;
      if (newDy === -dy && newDy !== 0) return;

      dx = newDx;
      dy = newDy;
      changedDirectionInFrame = true;
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (!isRunning && (e.key === ' ' || e.key === 'Enter')) {
        startGame();
        return;
      }

      switch (e.key) {
        case 'ArrowUp':
        case 'w':
        case 'W':
          changeDirection(0, -GRID_SIZE);
          break;
        case 'ArrowDown':
        case 's':
        case 'S':
          changeDirection(0, GRID_SIZE);
          break;
        case 'ArrowLeft':
        case 'a':
        case 'A':
          changeDirection(-GRID_SIZE, 0);
          break;
        case 'ArrowRight':
        case 'd':
        case 'D':
          changeDirection(GRID_SIZE, 0);
          break;
      }
    });

    // Touch & Button navigation
    btnUp.addEventListener('click', () => changeDirection(0, -GRID_SIZE));
    btnDown.addEventListener('click', () => changeDirection(0, GRID_SIZE));
    btnLeft.addEventListener('click', () => changeDirection(-GRID_SIZE, 0));
    btnRight.addEventListener('click', () => changeDirection(GRID_SIZE, 0));

    startBtn.addEventListener('click', startGame);

    // Initial draw to render canvas background before start
    draw();
  </script>
</body>
</html>
