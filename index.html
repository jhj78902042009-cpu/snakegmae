<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>땅 파기 게임</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #ffd700;
            margin-bottom: 5px;
        }

        #game-container {
            background-color: #2a2a2a;
            border: 2px solid #555;
            border-radius: 15px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .stats-box {
            background-color: #111;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 1.2rem;
            line-height: 1.6;
        }

        .highlight {
            font-weight: bold;
            color: #4CAF50;
        }

        #mineral-name {
            font-weight: bold;
        }

        #dig-btn {
            background-color: #ff5722;
            color: white;
            border: none;
            border-radius: 50%;
            width: 150px;
            height: 150px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(255, 87, 34, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
            margin-bottom: 30px;
        }

        #dig-btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 5px rgba(255, 87, 34, 0.4);
        }

        .upgrade-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .upgrade-btn {
            background-color: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .upgrade-btn:hover {
            background-color: #444;
        }

        .upgrade-btn:disabled {
            background-color: #222;
            color: #777;
            cursor: not-allowed;
            border-color: #333;
        }

        .log-box {
            margin-top: 20px;
            height: 60px;
            background-color: #111;
            border-radius: 5px;
            padding: 10px;
            font-size: 0.9rem;
            color: #aaa;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>광부 Bbaku의 지하 개척기</h1>
        <p>깊이 들어갈수록 희귀한 광물이 나옵니다!</p>

        <div class="stats-box">
            <div>보유 자산: <span id="money" class="highlight">0</span> 원</div>
            <div>현재 깊이: <span id="depth">0</span> m</div>
            <div>채굴 중인 광물: <span id="mineral-name" style="color:#8B4513;">축축한 흙</span></div>
        </div>

        <button id="dig-btn">⛏️ 파기!</button>

        <div class="upgrade-section">
            <button id="upg-shovel" class="upgrade-btn">
                <span><strong>삽 업그레이드</strong> (파는 깊이 +1m)</span>
                <span id="shovel-cost">10원</span>
            </button>
            <button id="upg-physical" class="upgrade-btn">
                <span><strong>피지컬 단련</strong> (채굴량 1.5배 증가)</span>
                <span id="phys-cost">50원</span>
            </button>
        </div>

        <div class="log-box" id="log">게임을 시작해보세요!</div>
    </div>

    <script>
        // 게임 상태 변수
        let money = 0;
        let depth = 0;
        
        let shovelPower = 1; // 한 번 클릭 시 파고 들어가는 깊이
        let physicalPower = 1; // 한 번 클릭 시 얻는 광물 배율 (근력)
        
        let shovelCost = 10;
        let physicalCost = 50;

        // 광물 데이터 (깊이에 따라 가치 상승)
        const minerals = [
            { name: '축축한 흙', minDepth: 0, value: 1, color: '#8B4513' },
            { name: '단단한 돌', minDepth: 50, value: 5, color: '#A9A9A9' },
            { name: '구리 광석', minDepth: 200, value: 25, color: '#B87333' },
            { name: '철 광석', minDepth: 500, value: 80, color: '#D3D3D3' },
            { name: '은 광석', minDepth: 1200, value: 300, color: '#C0C0C0' },
            { name: '금 광석', minDepth: 3000, value: 1000, color: '#FFD700' },
            { name: '다이아몬드', minDepth: 8000, value: 5000, color: '#00FFFF' },
            { name: '티타늄 합금 원석', minDepth: 20000, value: 25000, color: '#878681' }
        ];

        // DOM 요소 가져오기
        const moneyEl = document.getElementById('money');
        const depthEl = document.getElementById('depth');
        const mineralNameEl = document.getElementById('mineral-name');
        const shovelCostEl = document.getElementById('shovel-cost');
        const physCostEl = document.getElementById('phys-cost');
        const btnShovel = document.getElementById('upg-shovel');
        const btnPhysical = document.getElementById('upg-physical');
        const logEl = document.getElementById('log');

        // 현재 깊이에 맞는 광물 찾기
        function getCurrentMineral() {
            let current = minerals[0];
            for (let i = 0; i < minerals.length; i++) {
                if (depth >= minerals[i].minDepth) {
                    current = minerals[i];
                }
            }
            return current;
        }

        // UI 업데이트 함수
        function updateUI() {
            moneyEl.innerText = Math.floor(money).toLocaleString();
            depthEl.innerText = depth.toLocaleString();
            
            const currentMineral = getCurrentMineral();
            mineralNameEl.innerText = currentMineral.name;
            mineralNameEl.style.color = currentMineral.color;

            shovelCostEl.innerText = Math.floor(shovelCost).toLocaleString() + '원';
            physCostEl.innerText = Math.floor(physicalCost).toLocaleString() + '원';

            // 돈이 부족하면 버튼 비활성화
            btnShovel.disabled = money < shovelCost;
            btnPhysical.disabled = money < physicalCost;
        }

        // 로그 메시지 출력
        function showLog(msg) {
            logEl.innerText = msg;
        }

        // 땅 파기 버튼 클릭 이벤트
        document.getElementById('dig-btn').addEventListener('click', () => {
            depth += shovelPower;
            const currentMineral = getCurrentMineral();
            
            // 피지컬 배율을 적용한 최종 획득 금액
            const earned = currentMineral.value * physicalPower;
            money += earned;

            updateUI();
        });

        // 삽 업그레이드 (깊이 증가)
        btnShovel.addEventListener('click', () => {
            if (money >= shovelCost) {
                money -= shovelCost;
                shovelPower += 1;
                shovelCost *= 1.5; // 비용이 1.5배씩 증가
                
                showLog(`삽을 업그레이드했습니다! (한 번에 ${shovelPower}m 채굴)`);
                updateUI();
            }
        });

        // 피지컬 단련 (수익 배율 증가)
        btnPhysical.addEventListener('click', () => {
            if (money >= physicalCost) {
                money -= physicalCost;
                physicalPower *= 1.5; // 수익 배율 1.5배 증가
                physicalCost *= 2.5; // 비용은 2.5배씩 가파르게 증가
                
                showLog(`피지컬이 강해졌습니다! (광물 채취량 증가)`);
                updateUI();
            }
        });

        // 초기화
        updateUI();
    </script>
</body>
</html>
